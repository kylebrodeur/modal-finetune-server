[project]
name = "modal-finetune-server"
version = "1.3.0"
description = "Generic LoRA SFT + GGUF + serve pipeline on Modal, with profile-driven config and honest eval gates."
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.133,<0.137",
    "httpx>=0.27,<1",
    "modal>=1.5,<2",
    "pydantic>=2.10,<3",
]

[dependency-groups]
dev = [
    "basedpyright>=1.40.1",
    "pytest>=9.0.3",
    "ruff>=0.16.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["server", "eval", "research", "profiles"]

[tool.uv]
package = true

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-q"
testpaths = ["tests"]